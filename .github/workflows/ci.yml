name: CI

# Trunk-based (ADR-0014): valida push e PR. Somente analyze + testes unit/widget.
# Goldens e testes de integracao rodam localmente, fora do CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Baixar dependencias
        run: flutter pub get

      - name: Analisar (sem avisos)
        run: flutter analyze

      - name: Testes (unit + widget) com cobertura
        run: flutter test --coverage
